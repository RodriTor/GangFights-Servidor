plugins {
  // Permite que Gradle descargue solo el JDK que necesita.
  id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

rootProject.name = 'GangFights-Servidor'

// core   = toda la logica del servidor (red, partida, fisica Box2D, ventana de estado)
// lwjgl3 = el lanzador de escritorio: arma el .jar ejecutable
include 'lwjgl3', 'core'
